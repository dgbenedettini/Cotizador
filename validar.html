<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Latitud Sur — Validación de pedidos</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f4ee;color:#1a1a18}
  .app{max-width:460px;margin:0 auto;min-height:100vh;background:#f5f4ee;display:flex;flex-direction:column}
  .header{background:#fff;padding:20px 20px 16px;text-align:center;border-bottom:1px solid #eceae0}
  .header img{max-width:220px;width:60%;height:auto;display:block;margin:0 auto}
  .header .sub{font-size:12px;color:#888;margin-top:8px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  .content{flex:1;padding:20px}
  .card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .field-label{font-size:12px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .field-group{margin-bottom:14px}
  input[type=text],input[type=password]{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#fafaf7}
  input:focus{outline:none;border-color:#2f7a3c}
  .btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .btn-primary{background:#2f7a3c;color:#fff}
  .btn-primary:active{opacity:.85}
  .btn-approve{background:#2f7a3c;color:#fff;margin-top:10px}
  .error-box{background:#fdecea;color:#c0392b;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
  .empty{text-align:center;color:#999;padding:30px 20px;font-size:14px}
  .section-title{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 10px}
  .section-title:first-child{margin-top:0}
  .pedido-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .pedido-card.highlight{border:2px solid #2f7a3c}
  .pedido-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer}
  .estado-chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
  .estado-pendiente{background:#fdf3e0;color:#b3760c}
  .estado-aprobado{background:#e6f4e8;color:#2f7a3c}
  .fecha{font-size:12px;color:#999}
  .item-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid #f0efe8;gap:8px}
  .item-row:last-child{border-bottom:none}
  .item-name{font-weight:500}
  .item-sub{font-size:11px;color:#999;margin-top:1px}
  .item-right{text-align:right;white-space:nowrap}
  .item-price{font-size:11px;color:#999}
  .total-row{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #e5e4dc;font-size:15px;font-weight:700}
  .meta-row{font-size:12px;color:#777;margin-top:4px}
  .logout{text-align:center;padding:18px;font-size:12px;color:#999;text-decoration:underline;cursor:pointer}
  .approved-note{font-size:11px;color:#2f7a3c;margin-top:8px;font-weight:600}
  .toggle-hint{font-size:11px;color:#aaa}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:flex-end;justify-content:center}
  .modal-box{background:#fff;border-radius:18px 18px 0 0;padding:24px 22px 26px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto}
  .modal-box h3{margin:0 0 12px;font-size:17px}
  .legal-text{font-size:13px;line-height:1.6;color:#444;background:#f7f6f0;border-radius:10px;padding:14px;margin-bottom:16px}
  .modal-btn-row{display:flex;gap:10px}
  .modal-btn-row .btn{flex:1}
  .btn-cancel{background:#eee;color:#555}
</style>
</head>

<script>
const SB_URL = 'https://fyufwmlsjvscbhmykqfr.supabase.co';
const SB_KEY = 'sb_publishable_VAWqdh6BKVtxAIo3mNF3iA_ZPv5ZJcK';
const CONSENT_TEXT = 'He revisado el detalle del presente pedido (productos, cantidades, precios y condición de pago) y confirmo que fue solicitado por mí. Con esta validación otorgo mi conformidad expresa a la operación y me comprometo a saldar el monto total en la fecha de vencimiento acordada.';

let sessionRuc = null, sessionPass = null, sessionPedidos = [];

function sbRpc(fn, params){
  return fetch(SB_URL+'/rest/v1/rpc/'+fn, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
    body: JSON.stringify(params)
  }).then(function(r){
    return r.json().then(function(data){
      if(!r.ok){ throw new Error((data && (data.message||data.hint)) || 'Error de conexión'); }
      return data;
    });
  });
}

function fmtMoney(n){
  if(n===null||n===undefined) return '-';
  return 'USD ' + Number(n).toLocaleString('es-PY',{maximumFractionDigits:2});
}
function fmtFecha(iso){
  return new Date(iso).toLocaleDateString('es-PY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function login(){
  var ruc = document.getElementById('in-ruc').value.trim();
  var pass = document.getElementById('in-pass').value;
  var errEl = document.getElementById('login-error');
  errEl.innerHTML='';
  if(!ruc || !pass){ errEl.innerHTML='<div class="error-box">Completá RUC y contraseña.</div>'; return; }

  var btn = document.getElementById('login-btn');
  btn.textContent='Ingresando...'; btn.disabled=true;

  try{
    var res = await sbRpc('cliente_login', {p_ruc: ruc, p_password: pass});
    sessionRuc = ruc; sessionPass = pass;
    renderPedidos(res.razon_social, res.pedidos);
  }catch(err){
    errEl.innerHTML='<div class="error-box">'+err.message+'</div>';
    btn.textContent='Ingresar'; btn.disabled=false;
  }
}

function tokenDeUrl(){
  var params = new URLSearchParams(window.location.search);
  return params.get('token');
}

function itemsHtml(detalle){
  return (detalle||[]).map(function(it){
    return '<div class="item-row"><div><div class="item-name">'+(it.producto||'')+'</div>'
      +'<div class="item-sub">'+(it.lab||'')+'</div></div>'
      +'<div class="item-right">'+(it.total?fmtMoney(it.total):'-')
      +'<div class="item-price">'+(it.volumen?it.volumen+' u &middot; ':'')+(it.precio?'$'+Number(it.precio).toFixed(2):'')+'</div></div>'
      +'</div>';
  }).join('');
}

function pedidoCardHtml(p, opts){
  opts = opts||{};
  var isHighlight = opts.highlight;
  var estadoChip = p.estado==='aprobado'
    ? '<span class="estado-chip estado-aprobado">APROBADO</span>'
    : '<span class="estado-chip estado-pendiente">PENDIENTE</span>';

  var bodyId = 'detalle-'+p.token;
  var startsOpen = p.estado==='pendiente' || isHighlight;

  return '<div class="pedido-card'+(isHighlight?' highlight':'')+'" id="pedido-'+p.token+'">'
    +'<div class="pedido-top" onclick="toggleDetalle(\''+p.token+'\')"><span class="fecha">'+fmtFecha(p.creado_en)+'</span>'+estadoChip+'</div>'
    +'<div id="'+bodyId+'" style="display:'+(startsOpen?'block':'none')+'">'
    + itemsHtml(p.detalle)
    +'<div class="total-row"><span>Total</span><span>'+fmtMoney(p.monto_total)+'</span></div>'
    +(p.condicion_pago?'<div class="meta-row">Condición: '+p.condicion_pago+'</div>':'')
    +(p.destino?'<div class="meta-row">Destino: '+p.destino+'</div>':'')
    +(p.observaciones?'<div class="meta-row">'+p.observaciones+'</div>':'')
    +(p.estado==='pendiente'
        ? '<button class="btn btn-approve" onclick="abrirConsentimiento(\''+p.token+'\')">✓ Confirmar este pedido</button>'
        : '<div class="approved-note">✓ Validado por vos</div>')
    +'</div>'
    +(startsOpen?'':'<div class="toggle-hint" onclick="toggleDetalle(\''+p.token+'\')">Ver detalle ▸</div>')
    +'</div>';
}

function toggleDetalle(token){
  var el = document.getElementById('detalle-'+token);
  if(el) el.style.display = (el.style.display==='none' ? 'block' : 'none');
}

function renderPedidos(razonSocial, pedidos){
  sessionPedidos = pedidos;
  var highlightToken = tokenDeUrl();
  var pendientes = pedidos.filter(function(p){return p.estado==='pendiente';});
  var aprobados = pedidos.filter(function(p){return p.estado==='aprobado';});

  var html = '<div style="padding:4px 2px 14px;font-size:14px;color:#555">Hola, <b>'+razonSocial+'</b></div>';

  if(!pedidos.length){
    html += '<div class="empty">No tenés pedidos registrados todavía.</div>';
  } else {
    if(pendientes.length){
      html += '<div class="section-title">Pendientes de validar</div>';
      pendientes.forEach(function(p){
        html += pedidoCardHtml(p, {highlight: highlightToken===p.token});
      });
    }
    html += '<div class="section-title">Negocios aprobados</div>';
    if(aprobados.length){
      aprobados.forEach(function(p){
        html += pedidoCardHtml(p, {highlight: highlightToken===p.token});
      });
    } else {
      html += '<div class="empty">Todavía no tenés negocios aprobados.</div>';
    }
  }

  html += '<div class="logout" onclick="location.reload()">Salir</div>';
  document.getElementById('content').innerHTML = html;

  if(highlightToken){
    var el = document.getElementById('pedido-'+highlightToken);
    if(el) setTimeout(function(){ el.scrollIntoView({behavior:'smooth', block:'center'}); }, 200);
  }
}

function abrirConsentimiento(token){
  var ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = '<div class="modal-box">'
    +'<h3>Confirmación del pedido</h3>'
    +'<div class="legal-text">'+CONSENT_TEXT+'</div>'
    +'<div class="modal-btn-row">'
    +'<button class="btn btn-cancel" id="consent-cancel">Cancelar</button>'
    +'<button class="btn btn-approve" id="consent-accept" style="margin-top:0">Acepto y confirmo</button>'
    +'</div></div>';
  document.body.appendChild(ov);
  ov.querySelector('#consent-cancel').onclick = function(){ ov.remove(); };
  ov.querySelector('#consent-accept').onclick = function(){ ov.remove(); aprobar(token); };
}

async function aprobar(token){
  try{
    await sbRpc('cliente_aprobar_pedido', {
      p_ruc: sessionRuc, p_password: sessionPass, p_token: token,
      p_user_agent_cliente: navigator.userAgent
    });
    var res = await sbRpc('cliente_login', {p_ruc: sessionRuc, p_password: sessionPass});
    renderPedidos(res.razon_social, res.pedidos);
    alert('¡Listo! Tu pedido quedó confirmado.');
  }catch(err){
    alert('Error: '+err.message);
  }
}
</script>
